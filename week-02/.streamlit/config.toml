# Light neutral operations console.
#
# Red (#DC2626) is deliberately ABSENT from this file. It is reserved for
# genuinely elevated states, set per-element in the app. In Week 1 the widget
# accent was red, so every filter chip rendered alarming and red stopped
# carrying signal -- by the time something was actually wrong, the page had
# already spent the colour.

[theme]
base = "light"
font = "sans-serif"

backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
primaryColor = "#2563EB"

[theme.sidebar]
backgroundColor = "#0F172A"

[server]
headless = true
